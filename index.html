<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialNet Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" /> 

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header id="app-header">
        <div>
            <h1 id="app-title">LBYCPG3 SocialNet App - Profile Manager</h1>
        </div>
    </header>

    <div id="app-wrapper">
        <main class="container-fluid flex-grow-1 py-3">
            <div class="row g-3 h-100">
                
                <div class="col-12 col-md-4 d-flex flex-column">
                    <div class="sn-panel d-flex flex-column h-100">
                        <h6 class="fw-bold text-primary border-bottom pb-2 mb-3">Profile Management</h6>
                        
                        <label for="input-name" class="form-label fw-semibold small mb-1">Add New Profile</label>
                        <div class="input-group mb-3 shadow-sm">
                            <input type="text" id="input-name" class="form-control form-control-sm" placeholder="Enter full name">
                            <button id="btn-add" class="btn btn-primary btn-sm px-3">Add</button>
                        </div>
                        
                        <label for="input-lookup" class="form-label fw-semibold small mb-1">Search Profiles</label>
                        <div class="input-group mb-3 shadow-sm">
                            <input type="text" id="input-lookup" class="form-control form-control-sm" placeholder="Filter by name...">
                            <button id="btn-lookup" class="btn btn-outline-secondary btn-sm px-3">Search</button>
                        </div>
                        
                        <p class="small fw-semibold text-muted mb-1 mt-2">All Profiles</p>
                        <div id="profile-list" class="profile-list-box mb-3 shadow-sm flex-grow-1"></div>
                        
                        <button id="btn-delete" class="btn btn-danger btn-sm w-100 shadow-sm fw-bold">
                            Delete Selected Profile
                        </button>
                    </div>
                </div>
                
                <div class="col-12 col-md-4 d-flex flex-column">
                    <div class="sn-panel text-center h-100 d-flex flex-column">
                        <h6 class="fw-bold text-primary border-bottom pb-2 mb-3">Profile Information</h6>
                            
                        <img id="profile-pic" src="resources/images/default.png" alt="Profile picture" class="profile-thumb mt-2" />
                        
                        <h4 id="profile-name" class="profile-hero-name mt-3 mb-1">No Profile Selected</h4>
                        
                        <div id="profile-status" class="sn-textbox mb-2 text-muted fst-italic shadow-sm">&mdash;</div>
                        <div id="profile-quote" class="sn-textbox mb-4 shadow-sm fw-medium">&mdash;</div>
                        
                        <p class="small fw-semibold text-start text-muted mb-1">Friends List</p>
                        <div id="friends-list" class="sn-textbox sn-textbox--tall text-start shadow-sm flex-grow-1"></div>
                    </div>
                </div>
                
                <div class="col-12 col-md-4 d-flex flex-column">
                    <div class="sn-panel h-100 d-flex flex-column">
                        <h6 class="fw-bold text-primary border-bottom pb-2 mb-3">Edit Profile</h6>
                        
                        <label class="form-label fw-semibold small mb-1">Change Status</label>
                        <div class="input-group mb-4 shadow-sm">
                            <input type="text" id="input-status" class="form-control form-control-sm" placeholder="New status message">
                            <button id="btn-status" class="btn btn-primary btn-sm px-3">Update</button>
                        </div>
                        
                        <label class="form-label fw-semibold small mb-1">Change Picture</label>
                        <div class="input-group mb-4 shadow-sm">
                            <input type="text" id="input-picture" class="form-control form-control-sm" placeholder="e.g. my-avatar.png">
                            <button id="btn-picture" class="btn btn-info text-white btn-sm px-3">Update</button>
                        </div>
                        
                        <label class="form-label fw-semibold small mb-1">Change Quote</label>
                        <div class="input-group mb-4 shadow-sm">
                            <input type="text" id="input-quote" class="form-control form-control-sm" placeholder="Enter a favorite quote">
                            <button id="btn-quote" class="btn btn-warning btn-sm px-3">Update</button>
                        </div>
                        
                        <hr class="text-muted opacity-25">
                        
                        <label class="form-label fw-semibold small mb-1 mt-2">Add Friend</label>
                        <div class="input-group mb-4 shadow-sm">
                            <input type="text" id="input-friend" class="form-control form-control-sm" placeholder="Friend's full name">
                            <button id="btn-add-friend" class="btn btn-success btn-sm px-3">Add</button>
                        </div>
                        
                        <label class="form-label fw-semibold small mb-1">Remove Friend</label>
                        <div class="input-group shadow-sm">
                            <input type="text" id="input-remove-friend" class="form-control form-control-sm" placeholder="Friend's full name">
                            <button id="btn-remove-friend" class="btn btn-danger btn-sm px-3">Remove</button>
                        </div>
                        
                    </div>
                </div>
                
            </div>
        </main>
        
        <footer id="status-bar">
            <span id="status-message">Ready. Select a profile from the list.</span>
        </footer>
    </div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <script src="js/app.js"></script>
</body>
</html>
